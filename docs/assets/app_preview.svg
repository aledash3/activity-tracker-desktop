    <rect x="724" y="69" width="84" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" />
    <text x="766" y="89" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#334155">Reportes</text>

