<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="660" rx="14" fill="url(#bgGrad)" />

  <!-- Desktop Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="28" y="24" width="1144" height="612" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />

    <!-- Native Window Titlebar -->
