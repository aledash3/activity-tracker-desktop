    <text x="66" y="44" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Bitácora de Actividades</text>
    <!-- Window Controls (Windows style) -->
    <line x1="1088" y1="40" x2="1098" y2="40" stroke="#94a3b8" stroke-width="1.4" />
    <rect x="1116" y="35" width="9" height="9" fill="none" stroke="#94a3b8" stroke-width="1.4" />
    <line x1="1144" y1="35" x2="1153" y2="44" stroke="#ef4444" stroke-width="1.5" />
    <line x1="1153" y1="35" x2="1144" y2="44" stroke="#ef4444" stroke-width="1.5" />

